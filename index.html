<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>The Sanctuary — Reports</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f2;color:#1a2620;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid #e4e9e5;border-radius:14px;overflow:hidden;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,0.07)}
.card-header{background:#155230;padding:26px 28px 20px;text-align:center}
.card-header h1{font-size:1.35rem;font-weight:700;color:#fff;margin-bottom:4px}
.card-header p{font-size:0.78rem;color:#9ab0a0}
.card-body{padding:28px}

/* LOGIN */
.field label{display:block;font-size:0.72rem;font-weight:700;color:#6b8070;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid #e4e9e5;border-radius:8px;font-size:0.9rem;outline:none;transition:border .15s}
.field input:focus{border-color:#4caf72}
.btn{margin-top:14px;width:100%;background:#155230;color:#fff;border:none;border-radius:8px;padding:11px;font-size:0.88rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:#1e7040}
.err{margin-top:8px;font-size:0.76rem;color:#c8392a;text-align:center;min-height:18px}

/* APP */
#app{display:none}
.drop-zone{border:2px dashed #d5eddb;border-radius:12px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:18px}
.drop-zone:hover,.drop-zone.over{border-color:#2e9455;background:#f0f7f2}
.drop-zone .icon{font-size:2rem;margin-bottom:10px}
.drop-zone h2{font-size:1rem;font-weight:600;margin-bottom:6px}
.drop-zone p{font-size:0.76rem;color:#6b8070;margin-bottom:14px;line-height:1.6}
.drop-btn{background:#155230;color:#fff;border:none;border-radius:7px;padding:9px 22px;font-size:0.82rem;font-weight:600;cursor:pointer}
.drop-btn:hover{background:#1e7040}

.outputs{background:#f0f7f2;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.outputs p{font-size:0.76rem;color:#6b8070;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.out-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #d5eddb;font-size:0.82rem;color:#1a2620}
.out-item:last-child{border-bottom:none}
.out-item span{font-size:1rem}

#status{background:#fff;border:1px solid #e4e9e5;border-radius:10px;padding:12px 16px;font-size:0.82rem;color:#6b8070;display:flex;align-items:center;gap:10px;min-height:44px}
#status.processing{border-color:#4caf72;background:#f0f7f2;color:#155230}
#status.success{border-color:#2e9455;background:#f0f7f2;color:#1e5030}
#status.error{border-color:#c8392a;background:#fff0f0;color:#c8392a}
.spinner{width:14px;height:14px;border:2px solid #d5eddb;border-top-color:#2e9455;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.sign-out{background:none;border:none;color:#9ab0a0;font-size:0.74rem;cursor:pointer;margin-top:14px;display:block;width:100%;text-align:center;padding:6px}
.sign-out:hover{color:#1a2620}
</style>
</head>
<body>

<div id="app" class="card" style="display:block">
  <div class="card-header">
    <h1>Report Generator</h1>
    <p>The Sanctuary &mdash; Management</p>
  </div>
  <div class="card-body">
    <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()">
      <div class="icon">📂</div>
      <h2>Drop Treez Product Summary CSV</h2>
      <p>Generates two files automatically when dropped</p>
      <button class="drop-btn" onclick="event.stopPropagation();document.getElementById('fi').click()">Choose File</button>
      <input type="file" id="fi" accept=".csv" style="display:none"/>
    </div>

    <div class="outputs">
      <p>Generates</p>
      <div class="out-item"><span>📊</span> AOV Report &mdash; Sales Floor + Delivery (Excel)</div>
      <div class="out-item"><span>🎯</span> Coaching Report &mdash; Last shift vs monthly avg (Excel)</div>
    </div>

    <div id="status"><span>Ready &mdash; waiting for file</span></div>
  </div>
</div>

<script>
var dz=document.getElementById('dz');
['dragenter','dragover'].forEach(function(ev){ dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('over');}); });
['dragleave','drop'].forEach(function(ev){ dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('over');}); });
dz.addEventListener('drop',function(e){ var f=e.dataTransfer.files[0]; if(f&&f.name.endsWith('.csv')) handleFile(f); else setStatus('error','Please drop a .csv file'); });
document.getElementById('fi').addEventListener('change',function(e){ if(e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file){
  setStatus('processing','Reading file…',true);
  Papa.parse(file,{
    header:true, skipEmptyLines:true,
    complete:function(res){
      if(!res.data||!res.data.length){setStatus('error','File appears empty.');return;}
      runReports(res.data, file.name);
    },
    error:function(){ setStatus('error','Could not read file.'); }
  });
}

function setStatus(type,msg,spin){
  var el=document.getElementById('status');
  el.className=type; el.innerHTML='';
  if(spin){var s=document.createElement('div');s.className='spinner';el.appendChild(s);}
  var t=document.createElement('span');t.textContent=msg;el.appendChild(t);
}
</script>

<script>
// ── Name normalizer (delivery dispatchers)
var NAME_MAP = [
  [/\bashtyn\b|\bashyn\b|\bash\b/i,'Ashtyn'],[/\brayven\b/i,'Rayven'],
  [/\bdonavn\b|\bdonavan\b/i,'Donavan'],[/\bdenelle\b/i,'Denelle'],
  [/\bparit\b/i,'Parit'],[/\bkathleen\b|\bkat\b/i,'Kat / Kathleen'],
  [/\brichard\b|\brich\b/i,'Richard'],[/\bstas\b/i,'Stas'],
  [/\bjosh(ua)?\b/i,'Josh'],[/\bnorma\b/i,'Norma'],
  [/\balyssa\b/i,'Alyssa'],[/\bcassie\b/i,'Cassie'],
];
function dispName(n) {
  for (var i=0;i<NAME_MAP.length;i++) if (NAME_MAP[i][0].test(n)) return NAME_MAP[i][1];
  return 'No Dispatcher Listed';
}

// ── Parse CSV into ticket maps
function parseCSV(rows) {
  var FLOOR = {POS:1, PICKUP:1};
  // Sales floor tickets keyed by (date, cashier) -> tid -> {net, gross, addon}
  var sfByDayCashier = {};
  // Delivery tickets -> tid -> {dispatcher, net, gross, addon}
  var dlTix = {};

  rows.forEach(function(r) {
    var ttype = (r['Ticket Type']||'').toUpperCase().trim();
    var rtype = (r['Type']||'').trim();
    var tid   = (r['Ticket ID']||'').trim();
    var date  = (r['Date Open']||'').trim();
    if (!tid || !date) return;

    var net   = parseFloat(r['Net Sales']||0) || 0;
    var gross = parseFloat(r['Gross Receipts']||0) || 0;
    var isAddon = /add.?on/i.test(r['Product Name']||'');

    if (FLOOR[ttype] && rtype === 'Sale') {
      var ch = (r['Cashier']||'').trim();
      if (!ch || /register|sanctuary/i.test(ch)) return;
      var key = date + '||' + ch;
      if (!sfByDayCashier[key]) sfByDayCashier[key] = {};
      if (!sfByDayCashier[key][tid]) sfByDayCashier[key][tid] = {cashier:ch, date:date, net:0, gross:0, addon:0};
      sfByDayCashier[key][tid].net   += net;
      sfByDayCashier[key][tid].gross += gross;
      if (isAddon) sfByDayCashier[key][tid].addon += net;
    }

    if (ttype === 'DELIVERY' && rtype === 'Sale') {
      var note = (r['Ticket Notes']||'').trim();
      var disp = dispName(note);
      if (!dlTix[tid]) dlTix[tid] = {dispatcher:disp, net:0, gross:0, addon:0};
      dlTix[tid].net   += net;
      dlTix[tid].gross += gross;
      if (isAddon) dlTix[tid].addon += net;
    }
  });

  // Aggregate SF by (date, cashier)
  var sfDayCashier = {}; // key -> {cashier, date, net, gross, addon, txns}
  Object.keys(sfByDayCashier).forEach(function(key) {
    var tickets = sfByDayCashier[key];
    var agg = {net:0, gross:0, addon:0, txns:0, cashier:'', date:''};
    Object.values(tickets).forEach(function(t) {
      if (t.net <= 0) return;
      agg.net += t.net; agg.gross += t.gross; agg.addon += t.addon;
      agg.txns++; agg.cashier = t.cashier; agg.date = t.date;
    });
    if (agg.txns > 0) sfDayCashier[key] = agg;
  });

  // Aggregate DL by dispatcher
  var dlByDisp = {};
  Object.values(dlTix).forEach(function(t) {
    if (t.net <= 0) return;
    var d = t.dispatcher;
    if (!dlByDisp[d]) dlByDisp[d] = {net:0, gross:0, addon:0, txns:0};
    dlByDisp[d].net += t.net; dlByDisp[d].gross += t.gross;
    dlByDisp[d].addon += t.addon; dlByDisp[d].txns++;
  });

  // Per-employee: all days, sorted
  var empDays = {}; // cashier -> [{date, aov, txns, net, gross, addon, addon_pct}]
  Object.values(sfDayCashier).forEach(function(d) {
    if (!empDays[d.cashier]) empDays[d.cashier] = [];
    empDays[d.cashier].push({
      date: d.date, txns: d.txns, net: d.net, gross: d.gross, addon: d.addon,
      aov: d.net / d.txns,
      addon_pct: d.net > 0 ? d.addon / d.net * 100 : 0
    });
  });
  Object.keys(empDays).forEach(function(nm) {
    empDays[nm].sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  });

  // Build full monthly + last-shift per employee
  var empStats = [];
  Object.keys(empDays).forEach(function(nm) {
    var days = empDays[nm];
    var lastDay = days[days.length - 1];
    var mtdDays = days.slice(0, -1);
    var mtdNet = 0, mtdTxns = 0, mtdAddon = 0;
    mtdDays.forEach(function(d){ mtdNet += d.net; mtdTxns += d.txns; mtdAddon += d.addon; });
    var fullNet = 0, fullTxns = 0, fullAddon = 0, fullGross = 0;
    days.forEach(function(d){ fullNet += d.net; fullTxns += d.txns; fullAddon += d.addon; fullGross += d.gross; });

    empStats.push({
      name: nm,
      lastDate: lastDay.date,
      lastAov: lastDay.aov,
      lastTxns: lastDay.txns,
      lastAddon: lastDay.addon_pct,
      mtdAov: mtdTxns > 0 ? mtdNet / mtdTxns : lastDay.aov,
      mtdAdd: mtdNet > 0 ? mtdAddon / mtdNet * 100 : 0,
      mtdTxns: mtdTxns,
      fullAov: fullNet / fullTxns,
      fullTxns: fullTxns,
      fullAddon: fullNet > 0 ? fullAddon / fullNet * 100 : 0,
      fullNet: fullNet,
      fullGross: fullGross,
    });
  });

  // DL stats
  var dlStats = Object.keys(dlByDisp).map(function(nm) {
    var d = dlByDisp[nm];
    return {name:nm, aov:d.net/d.txns, aov_a:d.gross/d.txns, txns:d.txns,
            addon_pct:d.net>0?d.addon/d.net*100:0, net:d.net, gross:d.gross};
  });

  return { empStats: empStats, dlStats: dlStats };
}

// ── Classify employee for coaching
function classify(s) {
  var small = s.lastTxns < 6 || s.mtdTxns < 5;
  if (small) return 'small';
  var diff = s.lastAov - s.mtdAov;
  var lMet = s.lastAov >= 65, addMet = s.mtdAdd >= 4;
  if (lMet && addMet)  return 'star';
  if (lMet)            return 'aov_good';
  if (diff >= 3)       return 'trending';
  if (diff <= -4)      return 'dropping';
  if (s.mtdAov >= 62)  return 'close';
  return 'push';
}

function statusLabel(type) {
  return {star:'On Target', aov_good:'Strong AOV', trending:'Trending Up',
          close:'Almost There', dropping:'Check In', push:'Needs Push', small:'Small Sample'}[type] || '';
}

function coachingNote(s, type) {
  var fn = s.name.split(' ')[0];
  var diff = s.lastAov - s.mtdAov;
  var aovGap = (65 - s.mtdAov).toFixed(2);
  var addGap = (4 - s.mtdAdd).toFixed(1);
  var lbl = s.lastDate + ' (' + s.lastTxns + ' txns)';

  if (type === 'small')    return fn + ' has limited data (' + s.lastTxns + ' txns last shift, ' + s.mtdTxns + ' MTD). Monitor over a full shift.';
  if (type === 'star')     return fn + ' hit both goals last shift — $' + s.lastAov.toFixed(2) + ' AOV on ' + lbl + '. Add-on ' + s.mtdAdd.toFixed(1) + '%. Call it out.';
  if (type === 'aov_good') return fn + ' hit the $65 goal last shift ($' + s.lastAov.toFixed(2) + ' on ' + lbl + '). Add-on ' + s.mtdAdd.toFixed(1) + '%' + (parseFloat(addGap) > 0 ? ' — ' + addGap + '% from target.' : '.');
  if (type === 'trending') return fn + ' ran above their monthly avg last shift — $' + s.lastAov.toFixed(2) + ' vs $' + s.mtdAov.toFixed(2) + ' MTD on ' + lbl + '. Acknowledge the momentum.';
  if (type === 'dropping') return fn + ' dropped to $' + s.lastAov.toFixed(2) + ' last shift (' + lbl + ') vs $' + s.mtdAov.toFixed(2) + ' MTD. Quick check-in when they\'re next in.';
  if (type === 'close')    return fn + ' at $' + s.lastAov.toFixed(2) + ' last shift (' + lbl + ') — $' + aovGap + ' from the $65 goal. One good upsell per transaction closes it.';
  return fn + ' at $' + s.lastAov.toFixed(2) + ' last shift (' + lbl + '), $' + aovGap + ' below goal. Good candidate for a product pairing conversation.';
}

function aovTip(s) {
  if (s.mtdAov >= 65) return 'AOV above goal — stay consistent, avoid discounting.';
  var gap = (65 - s.mtdAov).toFixed(2);
  if (parseFloat(gap) <= 2.5) return 'AOV: $' + gap + ' from goal. One trade-up per customer closes it.';
  return 'AOV: Suggest a bundle or complementary product on every ticket.';
}

function addOnTip(s) {
  if (s.mtdAdd >= 4) return 'Add-on at ' + s.mtdAdd.toFixed(1) + '% — above the 4% goal. Keep it up.';
  return 'Add-on: ' + s.mtdAdd.toFixed(1) + '% vs 4% goal. One offer at the end of every transaction builds the habit.';
}

// ── Excel style helpers
var COLORS = {
  DK:'155230', MD:'2E9455', LT:'D5EDDB', BG:'F0F7F2',
  GD:'E8A020', GB:'FFF8EC', WH:'FFFFFF', MU:'9AB0A0',
  TX:'1A2620', RD:'C8392A', PU:'6030A0', PB:'F4EEFF',
  GRN_BG:'E8F8EE', AMB_BG:'FFF4EC', RED_BG:'FFF0F0', GRAY_BG:'F8F8F8',
  TEAL:'006080'
};

function xfill(wb, color) {
  return {patternType:'solid', fgColor:{rgb:color}};
}

function dateStr() {
  var now = new Date();
  return (now.getMonth()+1) + '-' + now.getDate() + '-' + now.getFullYear();
}

// ── REPORT 1: Monthly AOV Report (SF + DL)
function generateAOVReport(data, dateRange) {
  var empStats = data.empStats;
  var dlStats  = data.dlStats;

  var storeNet  = empStats.reduce(function(s,e){ return s+e.fullNet; }, 0);
  var storeTxns = empStats.reduce(function(s,e){ return s+e.fullTxns; }, 0);
  var storeAddon= empStats.reduce(function(s,e){ return s+e.fullNet*e.fullAddon/100; }, 0);
  var storeAOV  = storeNet / storeTxns;
  var storeAddonPct = storeNet > 0 ? storeAddon / storeNet * 100 : 0;

  var sfSorted = empStats.slice().sort(function(a,b){ return b.fullAov - a.fullAov; });
  var dlNamed  = dlStats.filter(function(d){ return d.name !== 'No Dispatcher Listed'; })
                         .sort(function(a,b){ return b.aov - a.aov; });
  var dlNo     = dlStats.filter(function(d){ return d.name === 'No Dispatcher Listed'; });
  var dlAll    = dlNamed.concat(dlNo);

  var dlNet  = dlNamed.reduce(function(s,d){ return s+d.net; }, 0);
  var dlTxns = dlNamed.reduce(function(s,d){ return s+d.txns; }, 0);
  var dlAOV  = dlTxns > 0 ? dlNet / dlTxns : 0;
  var dlAddonPct = dlNet > 0 ? dlNamed.reduce(function(s,d){ return s+d.net*d.addon_pct/100;},0)/dlNet*100 : 0;

  var wb = XLSX.utils.book_new();
  var medals = {0:'#1', 1:'#2', 2:'#3'};

  function buildSheet(title, data, stAov, stAddon, stTxns, isDL) {
    var aoa = [];
    // Title
    aoa.push([title + '  |  ' + dateRange,'','','','','']);
    aoa.push(['']);
    // Summary
    var lbl = isDL ? 'Channel AOV (Named)' : 'Store AOV';
    var lbl2 = isDL ? 'Total Deliveries' : 'Total Transactions';
    aoa.push([lbl, lbl2, 'Add-On %', dateRange, '', '']);
    aoa.push(['$'+stAov.toFixed(2), stTxns.toLocaleString(), stAddon.toFixed(1)+'%', '', '', '']);
    aoa.push(['']);
    // Headers
    var nameCol = isDL ? 'Dispatcher' : 'Budtender';
    var txnCol  = isDL ? 'Deliveries' : 'Transactions';
    aoa.push(['#', nameCol, 'AOV (Before Tax)', 'AOV (After Tax)', 'Add-On %', txnCol]);

    var rank = 0;
    data.forEach(function(d, i) {
      var isNo = isDL && d.name === 'No Dispatcher Listed';
      var aov   = isDL ? d.aov   : d.fullAov;
      var aov_a = isDL ? d.aov_a : d.fullAov * 1.2943;
      var addon = isDL ? d.addon_pct : d.fullAddon;
      var txns  = isDL ? d.txns  : d.fullTxns;
      var r = medals[rank] || ('#' + (rank+1));
      if (!isNo) rank++;
      aoa.push([isNo ? '—' : r, d.name, parseFloat(aov.toFixed(2)), parseFloat(aov_a.toFixed(2)),
                parseFloat((addon/100).toFixed(4)), txns]);
    });
    aoa.push(['']);
    aoa.push(['Average', '', parseFloat(stAov.toFixed(2)), parseFloat((stAov*1.2943).toFixed(2)),
              parseFloat((stAddon/100).toFixed(4)), stTxns]);
    aoa.push(['']);
    aoa.push(['* AOV = Net Sales / Transactions (before tax)  ·  Tax rate 29.43%  ·  Returns excluded']);

    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:6},{wch:28},{wch:18},{wch:16},{wch:11},{wch:14}];

    return ws;
  }

  var wsSF = buildSheet('Sales Floor AOV Report', sfSorted, storeAOV, storeAddonPct, storeTxns, false);
  var wsDL = buildSheet('Delivery AOV Report', dlAll, dlAOV, dlAddonPct, dlTxns, true);

  XLSX.utils.book_append_sheet(wb, wsSF, 'Sales Floor');
  XLSX.utils.book_append_sheet(wb, wsDL, 'Delivery');

  XLSX.writeFile(wb, 'AOV_Report_' + dateStr() + '.xlsx');
}

// ── REPORT 2: Coaching Report
function generateCoachingReport(data, dateRange) {
  var empStats = data.empStats;
  var storeNet  = empStats.reduce(function(s,e){ return s+e.fullNet; }, 0);
  var storeTxns = empStats.reduce(function(s,e){ return s+e.fullTxns; }, 0);
  var storeAOV  = storeNet / storeTxns;

  var sorted = empStats.slice().sort(function(a,b){ return b.lastAov - a.lastAov; });

  var wb   = XLSX.utils.book_new();
  var aoa  = [];

  aoa.push(['THE SANCTUARY — DAILY COACHING REPORT','','','','','','','','','']);
  aoa.push([dateRange + '  ·  Goals: $65 AOV · 4% Add-On  ·  Last Shift vs Monthly Average','','','','','','','','','']);
  aoa.push(['Store Average: $' + storeAOV.toFixed(2) + '  ·  ' + storeTxns.toLocaleString() + ' transactions MTD','','','','','','','','','']);
  aoa.push(['']);
  aoa.push(['Employee','MTD AOV','MTD Add-On%','MTD Txns','Last Shift Date','Last Shift AOV','Last Txns','vs MTD','Status','Coaching Note']);

  sorted.forEach(function(s) {
    var type = classify(s);
    var diff = s.lastAov - s.mtdAov;
    var note = coachingNote(s, type);
    if (type !== 'small') {
      note += '  |  ' + aovTip(s) + '  |  ' + addOnTip(s);
    }
    aoa.push([
      s.name,
      s.mtdTxns >= 3 ? parseFloat(s.mtdAov.toFixed(2)) : '—',
      s.mtdTxns >= 3 ? parseFloat((s.mtdAdd/100).toFixed(4)) : '—',
      s.mtdTxns || '—',
      s.lastDate,
      parseFloat(s.lastAov.toFixed(2)),
      s.lastTxns,
      s.mtdTxns >= 3 ? parseFloat(diff.toFixed(2)) : '—',
      statusLabel(type),
      note
    ]);
  });

  aoa.push(['']);
  aoa.push(['* MTD excludes last shift  ·  Diff = Last Shift AOV minus MTD avg  ·  Goals: $65 AOV · 4% add-on']);

  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:26},{wch:10},{wch:12},{wch:9},{wch:14},{wch:14},{wch:10},{wch:9},{wch:16},{wch:90}];
  XLSX.utils.book_append_sheet(wb, ws, 'Coaching Report');
  XLSX.writeFile(wb, 'Coaching_Report_' + dateStr() + '.xlsx');
}

// ── Entry point
function runReports(rows, fileName) {
  setStatus('processing', 'Computing stats...', true);
  setTimeout(function() {
    try {
      var dates = Array.from(new Set(rows.map(function(r){ return r['Date Open']; }).filter(Boolean))).sort();
      var dateRange = dates.length >= 2 ? 'May 1\u2013' + dates[dates.length-1].split('/')[1] + ', 2026' : fileName;
      var data = parseCSV(rows);
      if (!data.empStats.length) { setStatus('error', 'No sales floor data found in this file.'); return; }
      var errs = [];
      try { generateAOVReport(data, dateRange); } catch(e){ errs.push('AOV: '+e.message); console.error('AOV Report error:',e); }
      setTimeout(function(){
        try { generateCoachingReport(data, dateRange); } catch(e){ errs.push('Coaching: '+e.message); console.error('Coaching error:',e); }
        if(errs.length) setStatus('error', 'Error: ' + errs.join(' | '));
        else setStatus('success', '\u2705 2 files downloaded \u2014 AOV Report + Coaching Report');
      }, 800);
    } catch(e) {
      setStatus('error', 'Error: ' + e.message);
      console.error(e);
    }
  }, 30);
}

</script>
